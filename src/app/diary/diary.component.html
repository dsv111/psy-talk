<div class="diary-container">
  <div class="diary-binding"></div>
  <div class="diary-page">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div class="diary-date">
        {{ selectedDate | date: 'MMMM dd, yyyy' }}
      </div>
      <div>
        <input type="date"
          [max]="todayStr"
          [(ngModel)]="selectedDate"
          (change)="onDateChange()"
          style="padding:2px 10px; border-radius:7px; font-size:1rem;">
      </div>
    </div>

    <textarea class="diary-entry" [(ngModel)]="entryText" placeholder="Write your thoughts here..."></textarea>

    
<div class="mood-row">
      <label>Mood:</label>
      <ng-container *ngFor="let mood of moods">
        <button
          [class.selected]="entryMood === mood.value"
          (click)="entryMood = mood.value">
          {{ mood.icon }}
        </button>
      </ng-container>
    </div>
    <!-- <div class="media-section">
      <label>Upload Pose Image</label>
      <input type="file" accept="image/*">
      <label>Video/Mood Reference</label>
      <input type="file" accept="video/*">
    </div> -->

    <button class="save-btn" (click)="saveEntry()">Save</button>

    <div class="diary-entries">
  <!-- <h4 style="margin-top:35px; color:#337ca9;">This Day’s Entry</h4> -->
  <ng-container *ngIf="analysis.getDiaryEntry(selectedDate) as entry">
    <div class="entry-card">
      <span class="entry-date">{{ entry.date | date:'MMM dd, yyyy' }}</span>
      <span class="entry-mood">{{ getMoodIcon(entry.mood) }}</span>
      <div class="entry-text">{{ entry.text }}</div>
      <button class="delete-btn" (click)="deleteEntry(entry.date)">Delete</button>
      <button class="save-btn"
              style="background:#bed6e3; color:#337ca9; padding:2px 15px; margin-left:7px;"
              (click)="beginEdit(entry.date)">Edit</button>
    </div>
  </ng-container>
  <!-- <div *ngIf="!analysis.getDiaryEntry(selectedDate)" class="empty-msg">No diary entry for this date.</div> -->
</div>


  </div>
</div>
